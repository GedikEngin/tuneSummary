[project]
name = "tunesummary"
version = "0.1.0"
description = "Free, open source listening stats from your own Spotify data export."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
tunesummary = "tunesummary.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
