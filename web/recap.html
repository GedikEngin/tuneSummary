<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="{{BASE}}/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your recap — TuneSummary</title>
<meta name="description" content="Your listening year as an animated story: minutes, top artist, top tracks, genres, your listening clock and personality. Free and open source.">
<meta property="og:title" content="Your recap — TuneSummary">
<meta property="og:description" content="Your listening year as an animated story, made from your own Spotify data export.">
{{SOCIAL}}
<meta name="theme-color" content="#151513">
<script src="static/js/theme.js?v=1"></script>
<link rel="stylesheet" href="static/css/fonts.css?v=5">
<link rel="stylesheet" href="static/css/ts.css?v=5">
<link rel="stylesheet" href="static/css/recap.css?v=1">
</head>
<body data-page="recap" class="rc-body">
<main id="cover" class="rc-cover">
  <div class="rc-cover-in">
    <a href="app" class="mark" id="backLink">TuneSummary <span>/ back to stats</span></a>
    <div class="meta signal" id="coverKicker" style="margin-top:var(--s-7)">Your recap</div>
    <h1 class="display rc-h1">Your listening, <em>as a story.</em></h1>
    <p class="lede" style="margin-top:var(--s-4)">Nine animated slides: minutes, top artist, top tracks, genres, your listening clock, big days and your listening personality. Save any slide as an image, or the whole thing as a video.</p>
    <div id="coverBody" style="margin-top:var(--s-6)">
      <p class="meta" id="loadMsg">Loading your plays…</p>
    </div>
  </div>
</main>

<div id="stage" class="rc-stage hidden" role="region" aria-label="Recap story">
  <div id="frame" class="rc-frame">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="bars" class="rc-bars"></div>
  <div class="rc-top">
    <button type="button" class="rc-ic" id="bPause" aria-label="Pause">❚❚</button>
    <button type="button" class="rc-ic" id="bClose" aria-label="Close recap">✕</button>
  </div>
  <div id="tap" class="rc-tap" aria-hidden="true"></div>
  <div id="cta" class="rc-cta hidden"></div>
  <div class="rc-tools" id="tools">
    <button type="button" class="rc-btn" id="bImg">Save image</button>
    <button type="button" class="rc-btn" id="bVid">Save video</button>
    <button type="button" class="rc-btn hidden" id="bReplay">Replay</button>
  </div>
  </div>
  <p id="alt" class="rc-sr" aria-live="polite"></p>
</div>

<div id="overlay" class="rc-overlay hidden" role="dialog" aria-modal="true"><div class="rc-sheet" id="overlayBody"></div></div>

<script src="static/js/common.js?v=3"></script>
<script src="static/js/recapdata.js?v=2"></script>
<script src="static/js/recapdraw.js?v=3"></script>
<script src="static/js/recap.js?v=2"></script>
</body>
</html>
