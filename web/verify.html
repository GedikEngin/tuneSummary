<body data-page="verify">
<header id="bar"></header>
<main>

<section class="sec"><div class="wrap sec-grid">
  <div class="sec-rail"><span class="sec-no">§ —</span><h2 class="sec-title">One more <em>click</em></h2></div>
  <div class="sec-body prose">
    <form method="post" action="auth/verify" id="verifyForm">
      <input type="hidden" name="t" value="{{TOKEN}}">
      <p>Press the button to finish signing in. (This extra step stops email scanners from using up your one-time link.)</p>
      <p style="margin-top:var(--s-5)"><button class="btn btn--ink" type="submit">Sign in to TuneSummary <span class="arr">→</span></button></p>
    </form>
    <p id="verifyBad" class="hidden">This sign-in link is incomplete. <a href="signin">Request a new one →</a></p>
  </div>
</div></section>
</main>
<footer id="foot"></footer>
