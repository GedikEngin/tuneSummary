<body data-page="unsub">
<header id="bar"></header>
<main>

<section class="sec"><div class="wrap sec-grid">
  <div class="sec-rail"><span class="sec-no">§ —</span><h2 class="sec-title">Stop <em>reminders</em></h2></div>
  <div class="sec-body prose">
    <form method="post" action="unsubscribe" id="unsubForm">
      <input type="hidden" name="u" value="{{U}}">
      <p>Press the button and we won't send you any more reminder emails. Your account and data stay as they are.</p>
      <p style="margin-top:var(--s-5)"><button class="btn btn--ink" type="submit">Stop reminders <span class="arr">→</span></button></p>
    </form>
    <p id="unsubDone" class="hidden"><b>Done.</b> No more reminders. You can turn them back on from your <a href="account">account page</a>.</p>
    <p id="unsubMissing" class="hidden">That link didn't match an account; it may have been deleted. Nothing will be sent.</p>
  </div>
</div></section>
</main>
<footer id="foot"></footer>
<script src="static/js/common.js?v=3"></script>
<script src="static/js/pages.js?v=2"></script>
</body>
